# knob registry 예시 (가상). 스키마: schema/knob.schema.yaml
# 실데이터는 사내 paths.catalog_store 아래에 둔다.
# 주의: 아래 커맨드는 구조 설명용. 사내 Innovus 버전에서 set/readback 동작을 확인한 뒤 verified: true로 바꿀 것.
#       TODO(INHOUSE)

knobs:
  - knob_id: opt.useful_skew
    desc: "post-CTS/post-route opt에서 useful skew 허용 여부"
    category: opt
    value_type: bool
    persistence: sticky
    bindings:
      invs_legacy:
        set: "setOptMode -usefulSkew __VALUE__"
        match: "-usefulSkew"
        readback: "getOptMode -usefulSkew"
        value_map: { "true": true, "false": false, "1": true, "0": false }
        verified: false
      invs_stylus:
        set: "set_db opt_useful_skew __VALUE__"
        match: "opt_useful_skew"
        readback: "get_db opt_useful_skew"
        value_map: { "true": true, "false": false, "1": true, "0": false }
        verified: false
      fc: absent            # FC reference script 확보 전까지 생성 금지
    status: draft
    source_ref: "가상 예시"

  - knob_id: place.cong_effort
    desc: "global placement congestion effort"
    category: place
    value_type: enum
    allowed_values: [low, medium, high, auto]
    persistence: sticky
    bindings:
      invs_legacy:
        set: "setPlaceMode -place_global_cong_effort __VALUE__"
        match: "-place_global_cong_effort"
        readback: "getPlaceMode -place_global_cong_effort"
        verified: false
      invs_stylus: absent
      fc: absent
    status: draft
    source_ref: "가상 예시"
