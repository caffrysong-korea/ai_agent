# flow-bridge 환경 의존값 단일 집약 파일
# - 스킬/에이전트/툴은 환경 값을 직접 하드코딩하지 않고 이 파일을 참조한다.
# - 모든 TODO(INHOUSE)는 사내 opencode가 H1 단계에서 채운다.
# - 실데이터 경로는 사내 경로로 지정하고, 이 repo에는 실데이터를 커밋하지 않는다.

schema_version: 1

tools:
  innovus:
    version: "TODO(INHOUSE): 대상 Innovus 버전 (readback 커맨드 호환성 판단에 사용)"
    ui_modes_supported: [legacy, stylus]   # 고객 flow별 실제 모드는 flow_profile.ui_mode에 기록
    launch_wrapper: "TODO(INHOUSE): Innovus 실행 래퍼 이름. 직접 호출 금지 규칙과 함께 확정 (pnr-rundori 실행 방식 참고)"
  fusion_compiler:
    enabled: false                          # 첫 타겟은 Innovus. FC adapter 추가 시 true
    launch_wrapper: "TODO(INHOUSE): FC 실행 래퍼 (FC 확장 시)"
  primetime:
    launch_wrapper: pt_sub                  # pt_shell / primetime 직접 호출 금지
    lic_flag: "TODO(INHOUSE): pt_sub 라이선스 플래그"

execution:
  # flow-bridge는 job 실행/폴링 로직을 직접 갖지 않는다.
  runner_agent: pnr-rundori
  runner_contract: "TODO(INHOUSE): pnr-rundori 입력 contract 형식/위치. flow-bridge의 schema/contract/stage4_ablation_plan을 이 형식으로 변환하는 규칙을 여기에 명시"
  max_parallel_runs: "TODO(INHOUSE): 동시 제출 상한 (DELTA 기본값 참고)"
  poll_interval_sec: "TODO(INHOUSE): pnr-rundori 기본값 사용 여부"

agents:
  # 모델 바인딩. DELTA 결정(2026-09-28)에 따라 sub-agent도 PRO 모델 권장.
  bridge-pilot:   { model: "TODO(INHOUSE): DELTA delta-pilot과 동일한 primary 모델", mode: primary }
  flow-mapper:    { model: "TODO(INHOUSE)", mode: subagent }
  ledger-curator: { model: "TODO(INHOUSE)", mode: subagent }
  pnr-rundori:    { model: "TODO(INHOUSE): 기존 바인딩 유지", mode: subagent }
  task_timeout_hours: "TODO(INHOUSE): DELTA와 동일하게 sync task timeout 상향 여부 (DELTA는 4h)"

paths:
  # 모두 사내 경로. 상대경로면 repo 루트 기준.
  workspace:        "TODO(INHOUSE): flow-bridge 작업 산출물 루트 (run별 하위 디렉토리 생성)"
  catalog_store:    "TODO(INHOUSE): approved/reviewed/draft 카탈로그 yaml 저장 위치"
  ref_flow_maps:    "TODO(INHOUSE): REF flow 구조 md 저장 위치 (dtco-catalog-builder 산출)"
  ledger_store:     "TODO(INHOUSE): effect ledger 저장 위치 (jsonl 권장)"
  observation_guide: "TODO(INHOUSE): 고객 flow 관찰 가이드 md 위치 (curator만 수정)"
  python: "TODO(INHOUSE): 사용할 python3 경로. tools/ 의존성: PyYAML (설치 여부 확인)"

policy:
  # 검증 판정에 쓰이는 수치 기본값. 사내 데이터로 보정.
  noise_band:
    fmax_pct: "TODO(INHOUSE): run-to-run 노이즈 폭(%). 이 폭 이하 delta는 inconclusive 판정"
    power_pct: "TODO(INHOUSE)"
    area_pct: "TODO(INHOUSE)"
  ablation:
    strategy_default: leave_one_out        # baseline + all_on + leave_one_out
    max_runs: 20                            # DELTA와 동일한 상한
