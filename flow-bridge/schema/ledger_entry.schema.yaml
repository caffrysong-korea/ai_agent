# Effect ledger entry schema
# - "어떤 디자인에서 어떤 DTCO 항목이 어떤 delta를 냈는가"를 쌓는 지식 자산.
# - 쓰기: ledger-curator만 (append-only, jsonl 권장). 수정 대신 supersedes로 정정 entry 추가.
# - 핵심 규칙:
#   1) delta만 저장. 절대 PPA 저장 금지 (디자인 간 비교 불가).
#   2) readback_status가 applied가 아니면 effect 귀속 불가 → verdict는 반드시 invalid.
#   3) noise_band 이하 delta는 neutral이 아니라 inconclusive. "효과 없음"과 "판정 불가"를 구분.
#   4) negative / inconclusive도 반드시 기록 (같은 실패 반복 방지).

type: object
required: [entry_id, date, source, item, design_fp, flow_fp, context, readback_status, delta, verdict, recorded_by]
additionalProperties: false
properties:
  entry_id: { type: string, pattern: "^L-[0-9]{8}-[0-9]{3}$", description: "L-YYYYMMDD-NNN" }
  date:     { type: string }
  source:
    type: string
    enum: [infra_ref, customer_validation, seed_interview]
    description: >
      infra_ref = infra팀 reference design 실험, customer_validation = flow-bridge 4단계 검증,
      seed_interview = catalog-builder 이터레이션 중 infra 담당자 진술 (신뢰도 낮음, 실측 아님)
  item:
    type: object
    required: [item_id, version]
    additionalProperties: false
    properties:
      item_id: { type: string, pattern: "^DTCO-[0-9]{4}$" }
      version: { type: integer, minimum: 1 }
      applied_value: { description: "knob_set이면 실제 적용 값" }

  design_fp:
    description: "design_profile에서 뽑은 비교용 fingerprint (원본 profile 경로 + 핵심 수치 스냅샷)"
    type: object
    required: [design_id]
    additionalProperties: false
    properties:
      design_id:   { type: string }
      profile_ref: { type: string }
      primary_target_freq_mhz: { type: number }
      std_cell_count: { type: integer }
      macro_count:    { type: integer }
      target_util:    { type: number }
      traits:         { type: array, items: { type: string } }

  flow_fp:
    type: object
    required: [flow_id]
    additionalProperties: false
    properties:
      flow_id:      { type: string }
      flow_version: { type: string }
      tool_variant: { $ref: "common.schema.yaml#/$defs/tool_variant" }
      tool_version: { type: string }
      inserted_at:  { type: string, description: "hook_point id" }

  context:
    description: "같은 run에서 다른 항목들의 on/off 상태 (interaction 해석용)"
    type: object
    required: [ablation_role]
    additionalProperties: false
    properties:
      ablation_role: { type: string, enum: [single_on, leave_one_out, all_on, pair, seed] }
      other_items_on: { type: array, items: { type: string } }

  runs:
    type: object
    additionalProperties: false
    properties:
      baseline_run:  { type: string }
      treatment_run: { type: string }

  readback_status:
    type: string
    enum: [applied, overridden, missing, not_checkable, not_run]
  delta:     { $ref: "common.schema.yaml#/$defs/metric_delta" }
  noise_band_used:
    type: object
    description: "판정에 적용한 노이즈 폭 (config/env.yaml policy.noise_band 스냅샷)"
  verdict:
    type: string
    enum: [positive, neutral, negative, inconclusive, invalid]
  notes: { type: string }
  supersedes: { type: string, description: "정정 대상 entry_id" }
  recorded_by: { type: string }
