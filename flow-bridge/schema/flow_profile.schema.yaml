# Flow profile schema (flow 단위, 디자인과 무관)
# - flow-mapper가 고객 flow(또는 REF flow)를 읽어 생성한다. 같은 flow 버전이면 디자인이 달라도 재사용.
# - 디자인별 차이(SDC, design override 파일)는 design_profile에 둔다.
# - 위치 주장에는 반드시 citation. 확정 못한 것은 unresolved에 명시 (추측으로 채우기 금지).

$defs:

  stage_entry:
    type: object
    required: [abstract_stage, flow_stage_name, entry]
    additionalProperties: false
    properties:
      abstract_stage:  { $ref: "common.schema.yaml#/$defs/stage_id" }
      flow_stage_name: { type: string, description: "고객 flow에서 부르는 이름. 예) 03_place" }
      entry:           { $ref: "common.schema.yaml#/$defs/citation", description: "stage 시작 지점" }
      end:             { $ref: "common.schema.yaml#/$defs/citation", description: "stage 끝 지점 (readback 삽입 후보)" }
      files:           { type: array, items: { type: string }, description: "이 stage 동안 source되는 파일들" }

  hook_point:
    description: "overlay를 삽입할 수 있는 지점. 고객 flow가 제공하는 공식 hook(user script 슬롯 등)을 우선"
    type: object
    required: [id, abstract_stage, position, at, kind]
    additionalProperties: false
    properties:
      id:             { type: string, pattern: "^HP-[0-9]{3}$" }
      abstract_stage: { $ref: "common.schema.yaml#/$defs/stage_id" }
      position:       { type: string, enum: [stage_begin, before_main_cmd, after_main_cmd, stage_end] }
      at:             { $ref: "common.schema.yaml#/$defs/citation" }
      kind:
        type: string
        enum: [official_hook, insert_line]
        description: "official_hook = 고객 flow가 제공하는 사용자 스크립트 슬롯 / insert_line = source 한 줄 삽입 필요"
      notes:          { type: string }

  source_edge:
    type: object
    required: [from, to, at]
    additionalProperties: false
    properties:
      from: { type: string }
      to:   { type: string, description: "source 대상. 변수로 경로가 구성되면 해석 결과 + unresolved 기록" }
      at:   { $ref: "common.schema.yaml#/$defs/citation" }
      conditional: { type: string, description: "if/env var 조건 하에서만 source되면 조건 기술" }

  knob_setting:
    type: object
    required: [raw, abstract_stage, at]
    additionalProperties: false
    properties:
      knob_id:  { type: string, description: "registry로 정규화된 id. 매핑 못하면 생략하고 raw만" }
      raw:      { type: string, description: "원문 커맨드" }
      value:    { description: "해석된 값. 변수면 변수명 + resolved 여부를 notes에" }
      abstract_stage: { $ref: "common.schema.yaml#/$defs/stage_id" }
      at:       { $ref: "common.schema.yaml#/$defs/citation" }
      via:
        type: string
        enum: [direct, proc, loop, conditional, variable, unknown]
        description: "설정이 걸리는 방식. proc/loop/conditional/variable은 readback 확인 우선순위 높음"
      notes:    { type: string }

  design_override_point:
    description: "디자인별 설정 파일이 끼어드는 지점 (같은 flow라도 디자인마다 값이 달라지는 곳)"
    type: object
    required: [desc, at]
    additionalProperties: false
    properties:
      desc:     { type: string, description: "예) DESIGN_CFG 변수로 디자인별 tcl source" }
      at:       { $ref: "common.schema.yaml#/$defs/citation" }
      variable: { type: string, description: "디자인 파일 경로를 결정하는 변수/환경변수" }
      stages_affected: { type: array, items: { $ref: "common.schema.yaml#/$defs/stage_id" } }

type: object
required: [flow_id, flow_root, tool, ui_mode, stage_map, hook_points, knob_settings, unresolved, generated_by]
additionalProperties: false
properties:
  flow_id:   { type: string, description: "예) custA_blockflow_v3" }
  flow_kind: { type: string, enum: [customer, reference] }
  flow_root: { type: string, description: "citation 상대경로의 기준 디렉토리 (사내 경로)" }
  flow_version:
    type: string
    description: "flow 식별용 버전/커밋/파일 해시. 바뀌면 profile 재생성"
  tool:      { type: string, enum: [innovus, fusion_compiler] }
  ui_mode:   { type: string, enum: [legacy, stylus, mixed, unknown] }
  launch:
    type: object
    additionalProperties: false
    properties:
      entry_script: { type: string, description: "고객이 flow를 실행하는 진입 스크립트" }
      wrapper:      { type: string, description: "고객 flow가 쓰는 실행 래퍼/LSF 제출 방식" }
      at:           { $ref: "common.schema.yaml#/$defs/citation" }
  stage_map:      { type: array, items: { $ref: "#/$defs/stage_entry" } }
  source_chain:   { type: array, items: { $ref: "#/$defs/source_edge" } }
  hook_points:    { type: array, items: { $ref: "#/$defs/hook_point" } }
  knob_settings:  { type: array, items: { $ref: "#/$defs/knob_setting" } }
  design_override_points: { type: array, items: { $ref: "#/$defs/design_override_point" } }
  env_dependencies:
    type: array
    items: { type: string }
    description: "flow 동작에 영향을 주는 환경변수/전역변수"
  unresolved:   { type: array, items: { $ref: "common.schema.yaml#/$defs/unresolved_item" } }
  generated_by:
    type: object
    required: [agent, date]
    additionalProperties: false
    properties:
      agent: { type: string }
      date:  { type: string }
      observation_guide_version: { type: string, description: "참고한 관찰 가이드 버전" }
