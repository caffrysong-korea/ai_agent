# Knob registry entry schema
# - "같은 의미의 설정을 다른 문법으로 쓴 경우"를 같은 knob으로 인식하기 위한 정규화 사전.
#   예) Innovus legacy `setOptMode -usefulSkew true` 와 stylus `set_db opt_useful_skew true` → knob_id: opt.useful_skew
# - registry는 데이터다. 새 knob이 필요하면 항목을 추가한다 (Python 수정 불필요).
# - registry 실데이터는 사내 paths.catalog_store 아래에 둔다. 이 repo의 examples/는 가상 예시만.
# - 추가/수정 권한: dtco-catalog-builder 이터레이션 결과로만 반영 (status 머신은 catalog와 동일).

$defs:
  syntax_binding:
    type: object
    required: [set, readback, verified]
    additionalProperties: false
    properties:
      set:
        type: string
        description: >
          설정 커맨드 템플릿. 값 자리는 __VALUE__ 토큰.
          예) "setOptMode -usefulSkew __VALUE__"
      match:
        type: string
        description: >
          고객 flow에서 이 knob 설정을 찾을 때 LLM이 참고할 대표 문자열(정규식 아님, 사람이 읽는 힌트).
          예) "-usefulSkew"
      readback:
        type: string
        description: >
          실효값을 출력하는 TCL 표현식. stdout에 값 하나만 나오도록 작성.
          예) "getOptMode -usefulSkew"
      value_map:
        type: object
        description: "readback 출력 문자열 → 정규화 값 매핑. 예) {'1': true, '0': false}"
      verified:
        type: boolean
        description: "사내 툴 버전에서 set/readback이 실제 동작 확인되었는지. false면 readback 결과를 신뢰 등급 낮음으로 표시"
      notes: { type: string }

type: object
required: [knob_id, desc, category, value_type, persistence, bindings, status]
additionalProperties: false
properties:
  knob_id:
    type: string
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
    description: "<category>.<name> 형식, tool-agnostic. 예) opt.useful_skew, place.max_density"
  desc: { type: string }
  category:
    type: string
    enum: [design, place, opt, cts, route, timing, power, extraction, si, misc]
  value_type:
    type: string
    enum: [bool, int, float, enum, string, list]
  allowed_values:
    type: array
    description: "value_type이 enum일 때 허용값"
  persistence:
    type: string
    enum: [sticky, per_command, unknown]
    description: >
      sticky = mode/attribute 설정처럼 이후 stage까지 유지됨 (override 탐지 대상).
      per_command = 특정 커맨드 옵션으로만 적용 (해당 커맨드 호출 위치가 반영 위치).
      unknown = 확정 못함 → readback으로 확인 필요.
  bindings:
    type: object
    description: "tool_variant → syntax_binding 또는 문자열 'absent'"
    additionalProperties: false
    properties:
      invs_legacy:  { oneOf: [ { $ref: "#/$defs/syntax_binding" }, { const: absent } ] }
      invs_stylus:  { oneOf: [ { $ref: "#/$defs/syntax_binding" }, { const: absent } ] }
      fc:           { oneOf: [ { $ref: "#/$defs/syntax_binding" }, { const: absent } ] }
  status:
    type: string
    enum: [draft, reviewed, approved]
  source_ref:
    type: string
    description: "이 knob 정의의 근거 (REF flow 구조 md 섹션, 툴 문서명 등)"
