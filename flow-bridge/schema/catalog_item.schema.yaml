# DTCO / DM catalog item schema
# - infra팀 reference 설정 하나 = 항목 하나. dtco-catalog-builder가 infra 담당자와 이터레이션으로 작성한다.
# - 상태: draft → reviewed → approved. flow-bridge 다운스트림은 approved만 사용한다.
# - ASK: 사람의 답이 필요한 필드. 추론으로 채우지 않는다.
# - 툴 binding은 reference script가 존재하는 variant만 채운다. 나머지는 absent.

$defs:

  action_knob_set:
    description: "knob registry에 정의된 knob을 특정 값으로 설정. binding/readback은 registry에서 해석"
    type: object
    required: [kind, knob_id, value]
    additionalProperties: false
    properties:
      kind:    { const: knob_set }
      knob_id: { type: string }
      value:   { description: "registry의 value_type에 맞는 값" }

  snippet_binding:
    type: object
    required: [code, verified]
    additionalProperties: false
    properties:
      code:     { type: string, description: "overlay에 들어갈 TCL. 여러 줄 가능" }
      readback: { type: string, description: "적용 여부를 확인할 TCL 표현식. 없으면 이 action은 readback 불가로 표시" }
      expect:   { type: string, description: "readback 출력이 포함해야 하는 문자열" }
      verified: { type: boolean }
      source_ref: { $ref: "common.schema.yaml#/$defs/citation" }

  action_snippet:
    description: "knob 하나로 표현 불가한 설정 (cell list, NDR 정의, 커스텀 proc 등)"
    type: object
    required: [kind, desc, bindings]
    additionalProperties: false
    properties:
      kind: { const: snippet }
      desc: { type: string }
      bindings:
        type: object
        additionalProperties: false
        properties:
          invs_legacy: { oneOf: [ { $ref: "#/$defs/snippet_binding" }, { const: absent } ] }
          invs_stylus: { oneOf: [ { $ref: "#/$defs/snippet_binding" }, { const: absent } ] }
          fc:          { oneOf: [ { $ref: "#/$defs/snippet_binding" }, { const: absent } ] }

  precondition:
    type: object
    required: [desc, check]
    additionalProperties: false
    properties:
      desc:  { type: string, description: "예) clock tree가 생성된 이후여야 함" }
      check:
        type: string
        enum: [stage_order, design_profile, library, readback, manual]
        description: >
          stage_order = 삽입 stage로 자동 판정, design_profile = 디자인 profile 필드로 판정,
          library = 특정 cell/lib 존재, readback = 툴 질의로 판정, manual = 사람 확인
      field: { type: string, description: "check가 design_profile일 때 대상 필드 경로. 예) sdc.clocks" }
      expr:  { type: string, description: "판정 조건 (사람이 읽는 형식). 예) 'count > 0'" }

  amenability_hint:
    type: object
    required: [when, verdict]
    additionalProperties: false
    properties:
      when:    { type: string, description: "디자인 조건. 예) target freq가 lib 기준 상위 20% 이상" }
      field:   { type: string, description: "판정에 쓰는 design_profile 필드 경로 (가능하면 명시)" }
      verdict: { type: string, enum: [favorable, unfavorable, excluded] }
      basis:   { type: string, description: "근거 (infra 실험, 경험, 문헌). 근거 없으면 ASK" }

type: object
required: [item_id, version, status, title, intent, abstract_stage, actions, expected_effect, owner]
additionalProperties: false
properties:
  item_id:
    type: string
    pattern: "^DTCO-[0-9]{4}$"
  version:
    type: integer
    minimum: 1
    description: "내용이 바뀌면 증가. ledger는 item_id+version 단위로 결과를 분리 저장"
  status:
    type: string
    enum: [draft, reviewed, approved]
  title: { type: string }
  intent:
    oneOf: [ { type: string }, { $ref: "common.schema.yaml#/$defs/ask" } ]
    description: "이 설정이 무엇을 노리는가 (infra 담당자 확인 필수)"
  category:
    type: string
    enum: [dtco, dm]
    description: "dtco = 공정/라이브러리 연계 설정, dm = PnR design methodology 설정"
  abstract_stage:
    $ref: "common.schema.yaml#/$defs/stage_id"
  order_dep:
    type: object
    additionalProperties: false
    properties:
      after:  { type: array, items: { $ref: "common.schema.yaml#/$defs/stage_id" } }
      before: { type: array, items: { $ref: "common.schema.yaml#/$defs/stage_id" } }
  actions:
    type: array
    items: { oneOf: [ { $ref: "#/$defs/action_knob_set" }, { $ref: "#/$defs/action_snippet" } ] }
  preconditions:
    oneOf:
      - { type: array, items: { $ref: "#/$defs/precondition" } }
      - { $ref: "common.schema.yaml#/$defs/ask" }
  expected_effect:
    oneOf:
      - type: object
        additionalProperties: false
        properties:
          fmax:       { type: string, enum: ["+", "-", "0", "±", "?"] }
          power:      { type: string, enum: ["+", "-", "0", "±", "?"] }
          area:       { type: string, enum: ["+", "-", "0", "±", "?"] }
          congestion: { type: string, enum: ["+", "-", "0", "±", "?"] }
          runtime:    { type: string, enum: ["+", "-", "0", "±", "?"] }
        description: "+ = 개선, - = 악화, 0 = 영향 없음, ± = 디자인 의존, ? = 미상"
      - { $ref: "common.schema.yaml#/$defs/ask" }
  amenability_hints:
    oneOf:
      - { type: array, items: { $ref: "#/$defs/amenability_hint" } }
      - { $ref: "common.schema.yaml#/$defs/ask" }
  conflicts_with:
    type: array
    items: { type: string, pattern: "^DTCO-[0-9]{4}$" }
    description: "동시 적용 시 충돌/상쇄되는 항목"
  evidence_refs:
    oneOf:
      - { type: array, items: { type: string } }
      - { $ref: "common.schema.yaml#/$defs/ask" }
    description: "infra 실험 결과 위치 등. ledger seed의 출처"
  ref_flow_location:
    description: "REF flow에서 이 설정이 있는 위치 (REF flow 구조 md 작성 시 확정)"
    type: array
    items: { $ref: "common.schema.yaml#/$defs/citation" }
  owner: { type: string, description: "infra 담당자 (approve 권한자)" }
  review_log:
    type: array
    items:
      type: object
      required: [date, by, change]
      additionalProperties: false
      properties:
        date:   { type: string }
        by:     { type: string }
        change: { type: string }
