# 공용 정의
# 스키마 표기법: JSON Schema의 부분집합을 YAML로 작성.
#   사용 키워드: type, required, properties, additionalProperties(bool), enum, items,
#               pattern, minimum, maximum, oneOf, $ref, const, description
#   $ref 형식: "#/$defs/<name>" (같은 파일) 또는 "<file>.yaml#/$defs/<name>" (참조하는 파일 기준 상대경로)
#   빈 스키마({} 또는 description만)는 "아무 값이나 허용"
#   tools/validate.py(P4)가 이 부분집합만 해석한다. 다른 키워드를 쓰면 validate가 fail-fast로 거부한다.

$defs:

  stage_id:
    type: string
    enum: [init, floorplan, place, cts, post_cts, route, post_route, export]
    description: "schema/stage_taxonomy.yaml의 id와 반드시 동기화"

  tool_variant:
    type: string
    enum: [invs_legacy, invs_stylus, fc]
    description: "툴 + UI 모드. Innovus는 legacy(setXxxMode)와 stylus(set_db)를 별개 variant로 취급"

  ask:
    const: ASK
    description: "사람의 답이 필요한 필드. 추론으로 채우기 금지"

  citation:
    description: >
      LLM이 flow 안의 위치를 주장할 때 반드시 붙이는 근거.
      validate는 file의 line 번호 줄에 excerpt 문자열이 실제로 포함되어 있는지 대조한다.
    type: object
    required: [file, line, excerpt]
    additionalProperties: false
    properties:
      file:    { type: string, description: "flow 루트 기준 상대경로 (flow_profile.flow_root 기준)" }
      line:    { type: integer, minimum: 1 }
      excerpt: { type: string, description: "해당 줄에 실제로 존재하는 부분 문자열 (공백 정규화 후 비교)" }

  unresolved_item:
    description: "LLM이 확정하지 못한 것. 숨기지 말고 명시적으로 남긴다."
    type: object
    required: [what, why]
    additionalProperties: false
    properties:
      what:  { type: string }
      why:   { type: string }
      where: { $ref: "#/$defs/citation" }
      next_action: { type: string, description: "예: readback으로 확인 / 유저에게 질문 / 추가 파일 열람" }

  evidence_level:
    type: string
    enum: [rule, ledger, heuristic, none]
    description: >
      rule = 카탈로그 precondition/hard rule, ledger = 유사 디자인 실측,
      heuristic = 휴리스틱(상태 표시 필요), none = 근거 없음(실험 후보로만 제시)

  metric_delta:
    description: "baseline 대비 delta. 절대값 저장 금지 (디자인 간 비교 불가)"
    type: object
    additionalProperties: false
    properties:
      fmax_pct:      { type: number }
      wns_ns:        { type: number }
      tns_ns:        { type: number }
      power_pct:     { type: number }
      leakage_pct:   { type: number }
      area_pct:      { type: number }
      drc_delta:     { type: integer }
      runtime_pct:   { type: number }
